services:
  backend:
    build:
      context: ./finpilot/backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://finpilot:finpilot_pass@db:5432/finpilot_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=finpilot-contest-submission-secret-2026
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./finpilot/sdk:/app/sdk

  db:
    image: postgres:16-alpine
    container_name: finpilot-postgres
    restart: always
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot_pass
      POSTGRES_DB: finpilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot -d finpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
