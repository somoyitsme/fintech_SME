<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPilot Widget</title>
  <link rel="stylesheet" href="/sdk/widget.css">
</head>
<body>
  <div id="finpilot-widget">
    <div class="widget-header">
      <div class="header-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <h2>FinPilot</h2>
      </div>
      <button id="minimize-btn" class="icon-btn" title="Minimize">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <div id="messages" class="messages"></div>

    <div id="status-bar" class="status-bar" style="display: none;">
      <div class="status-spinner"></div>
      <span id="status-text"></span>
    </div>

    <div class="widget-input">
      <textarea
        id="user-input"
        placeholder="Ask about cash flow, financing, invoices..."
        rows="2"
      ></textarea>
      <button id="send-btn" class="send-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="/sdk/widget.js"></script>
</body>
</html>
